name: Build Android app

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Optional release signing key (repository secrets)
        env:
          KEYSTORE_B64: ${{ secrets.EASYPRINT_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "EASYPRINT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Build APK
        env:
          EASYPRINT_KEYSTORE_PASSWORD: ${{ secrets.EASYPRINT_KEYSTORE_PASSWORD }}
          EASYPRINT_KEY_ALIAS: ${{ secrets.EASYPRINT_KEY_ALIAS }}
          EASYPRINT_KEY_PASSWORD: ${{ secrets.EASYPRINT_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon && cp app/build/outputs/apk/release/app-release.apk EasyPrint.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EasyPrint-android
          path: android/EasyPrint.apk
